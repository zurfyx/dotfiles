# gitleaks config for a public dotfiles repo.
# On top of the default secret rules, these custom rules keep out the kinds
# of strings that leak where you work, where you live on disk, and how to
# reach your machines. This file is the one place allowed to spell them out.

title = "dotfiles"

[extend]
useDefault = true

[[rules]]
id = "employer-vocabulary"
description = "Internal tool and domain names that identify an employer"
regex = '''(?i)\b(fbsource|agentbox|quicklog|devvm|devserver|sandcastle|phabricator|fburl|meta\.com|facebook\.com|fb\.com)\b'''

[[rules]]
id = "tailnet-or-internal-host"
description = "Tailscale tailnet hostnames and internal-network host suffixes"
regex = '''(?i)\b[a-z0-9-]+\.(ts\.net|internal|corp|lan)\b'''

[[rules]]
id = "private-ip"
description = "RFC1918 and CGNAT (100.64/10) IP addresses"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.\d{1,3}\.\d{1,3})\b'''

[[rules]]
id = "personal-email"
description = "Personal or employer email addresses"
regex = '''[A-Za-z0-9._%+-]+@(gmail|meta|facebook|outlook|icloud)\.com'''

[[rules]]
id = "absolute-home-path"
description = "Absolute macOS home paths; use $HOME or ~ instead"
regex = '''/Users/[a-z][a-z0-9]*/'''

[[rules]]
id = "cloud-drive-path"
description = "Cloud drive mount paths that reveal account names"
regex = '''(?i)CloudStorage/|GoogleDrive-|Dropbox/'''

[allowlist]
description = "The config names the vocabulary it bans; the owner's own address is already public in every commit he has authored, so it is not what this rule is for — colleagues' addresses and employer domains are"
paths = ['''\.gitleaks\.toml$''']
regexes = [
    '''gerard\.rovira\.sanchez@gmail\.com''',
    '''100\.100\.100\.100''',  # Tailscale MagicDNS, a documented public constant
]
