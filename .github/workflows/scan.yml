# scan — the same hygiene checks the pre-commit hook runs, but enforced
# server-side so a machine without the hook installed can't slip something
# through. The weekly cron catches rule updates against old history.
name: scan

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  author-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit author must be a GitHub noreply address
        run: |
          bad="$(git log --format='%ae' | sort -u | grep -v '@users\.noreply\.github\.com$' || true)"
          if [ -n "$bad" ]; then
            echo "Commits found with non-noreply author emails:"
            echo "$bad"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck and zsh
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: shellcheck the bash scripts
        run: |
          shellcheck .githooks/pre-commit
          for f in .chezmoiscripts/*.sh dot_local/bin/executable_tailscaled-resync; do
            [ -e "$f" ] || continue
            shellcheck "$f"
          done
      - name: zsh syntax check
        run: |
          for f in dot_zshrc dot_zprofile dot_local/bin/executable_clauded; do
            [ -e "$f" ] || continue
            zsh -n "$f"
          done
