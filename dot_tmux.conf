# .tmux.conf
set -g default-command "${SHELL}"
set -g history-limit 500000
set -g mouse on
set -s default-terminal "tmux-256color"
set -s escape-time 0

# ─── status bar ──────────────────────────────────────────────────────────────
# tmux's stock green bar; every segment colour below is picked to read on it
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=green,fg=black"
set -g status-left-length 100
set -g status-right-length 140

# emphasis uses colour16 rather than `black`: terminals brighten bold ANSI
# colours, which washes bold black/white out to grey against the green bar
#
# session · repo state · prefix indicator
set -g status-left "#[fg=colour16,bold][#S]#[default] #(~/.local/bin/tmux-scm '#{pane_current_path}' #{client_width})#{?client_prefix, #[fg=green#,bg=colour16#,bold] ^B ,}#[default]#[fg=colour235] · "

# cpu · mem · disk · battery · host · date · time
# below 130 columns the host and date drop out and the metrics go compact, so
# the window list is never the thing that gets truncated away
set -g status-right "#(~/.local/bin/tmux-metrics #{client_width})#[fg=colour235] · #{?#{e|>:#{client_width},130},#[fg=colour16]#{host_short}#[fg=colour235] · #[fg=colour235]%Y-%m-%d ,}#[fg=colour16,bold]%H:%M"

setw -g window-status-separator ""
# inactive dim, activity solid, current bold — no hue changes, all black on green
setw -g window-status-format "#[fg=colour235,nobold] #I:#W#F "
setw -g window-status-current-format "#[fg=colour16,bold] #I:#W#{?window_zoomed_flag, Z,}#F "
setw -g window-status-activity-style "fg=colour16,none"
setw -g window-status-bell-style "fg=colour231,bg=colour88,bold"
setw -g monitor-activity on
set -g visual-activity off

bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
